    <main class="page-wrapper">
        <section class="confirmation-card" aria-labelledby="confirmation-title">

            <p class="confirmation-message">Your product review has been submitted successfully.</p>
            

            <div class="counter-box">
                <p>You have completed</p>
                <p class="review-count" id="reviewCount" aria-live="polite">0</p>
                <p>product review<span id="reviewPlural">s</span>.</p>
            </div>

            <a class="back-link" href="form.html">Write Another Review</a>
        </section>
    </main>

    <footer>
        <p>© <span id="currentyear"></span> Martins Amorin | Nigeria</p>
        <p id="lastModified"></p>
    </footer>
