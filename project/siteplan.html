<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review: Pacana Punta Cana</title>
  <meta name="description" content="Submit a product review by selecting a product, rating it, and sharing your experience.">
  <meta name="author" content="Alan Feliz">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/siteplan.css">
</head>
<body>
  <header>
    <h1>Site Plan</h1>
  </header>

  <main>
    <section>
      <h2>Site Name</h2>
      <img src="images/ejemplo.jpg" alt="Ejemplo">
      <p><strong>Name:</strong> Pacana Punta Cana</p>
      <p><strong>Logo:</strong> 🌴🏖️ (temporary logo)</p>
      <p><strong>Description:</strong> I chose this name because it reflects the tropical and relaxing atmosphere of Punta Cana.</p>
    </section>

    <section>
      <h2>Choose a Product</h2>
      <select id="productName"></select>
    </section>
  </main>

  <footer>
    <p>© <span id="currentyear"></span></p>
    <p><span id="lastModified"></span></p>
  </footer>

  <script>
    const products = [
      { id: 1, name: "Laptop" },
      { id: 2, name: "Phone" },
      { id: 3, name: "Tablet" }
    ];

    const productSelect = document.querySelector("#productName");
    products.forEach((product) => {
      const option = document.createElement("option");
      option.value = product.id;
      option.textContent = product.name;
      productSelect.appendChild(option);
    });

    const currentYear = new Date().getFullYear();
    document.querySelector("#currentyear").textContent = currentYear;
    document.querySelector("#lastModified").textContent =
      `Last Modification: ${document.lastModified}`;
  </script>
</body>
</html>
